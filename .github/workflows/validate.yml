name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.3
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee@0.24.2
      - name: Install Nushell
        uses: taiki-e/install-action@v2
        with:
          tool: nu@0.111.0
      - name: Install zk
        run: |
          curl -fsSL https://github.com/zk-org/zk/releases/download/v0.15.6/zk-v0.15.6-linux-amd64.tar.gz -o /tmp/zk.tar.gz
          tar -xzf /tmp/zk.tar.gz -C /tmp
          sudo install /tmp/zk /usr/local/bin/zk
      - name: Install Crux
        run: >-
          cargo install --git https://github.com/89jobrien/crux.git
          --rev 8d54a65df7696ec01b1ef27a5c0972422020efc1
          crux-agentic --locked
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Install quality tools
        run: bun install --frozen-lockfile
      - name: Audit dependencies
        run: bun audit
      - name: Run non-mutating quality gates
        run: crux run Cruxfile ci
