{% extends "base.html" %}
{% block title %}Projects — {{ config.title }}{% endblock title %}
{% block content %}
<h1>Projects</h1>
<ul class="card-list">
  {% for page in section.pages %}
  <li class="card">
    <a href="{{ page.permalink }}">{{ page.title }}</a>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endblock content %}
