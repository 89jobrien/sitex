{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  {% if page.extra.repo %}<p><a href="{{ page.extra.repo }}">Repository</a></p>{% endif %}
  {{ page.content | safe }}
</article>
{% endblock content %}
