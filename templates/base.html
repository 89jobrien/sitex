<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta name="theme-color" content="#0f1115">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="{{ current_url }}">
  <meta property="og:type" content="{% block social_type %}website{% endblock social_type %}">
  <meta property="og:title" content="{% block social_title %}{{ config.title }}{% endblock social_title %}">
  <meta property="og:description" content="{% block social_description %}{{ config.description }}{% endblock social_description %}">
  <meta property="og:url" content="{{ current_url }}">
  <meta property="og:site_name" content="{{ config.title }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ get_url(path="favicon.svg") }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
  {% if config.generate_feeds %}
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}">
  {% endif %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ get_url(path="/") }}">{{ config.title }}</a>
    <nav>
      <a href="{{ get_url(path="/about/") }}">About</a>
      <a href="{{ get_url(path="/projects/") }}">Projects</a>
      <a href="{{ get_url(path="/blog/") }}">Blog</a>
      <a href="{{ get_url(path="/tags/") }}">Tags</a>
      <a href="{{ get_url(path="/graph/") }}">Graph</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <span>&copy; {{ now() | date(format="%Y") }} Joseph O'Brien</span>
    <span class="footer-links">
      <a href="https://github.com/89jobrien" rel="noreferrer">GitHub</a>
      {% if config.generate_feeds %}
      <a href="{{ get_url(path="atom.xml") }}">Atom feed</a>
      {% endif %}
    </span>
  </footer>
  {% block scripts %}{% endblock scripts %}
</body>
</html>
